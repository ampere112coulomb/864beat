name: Build chart jackets

on:
  push:
    paths:
      - 'song/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/build_jackets.py --song-dir song --output-dir song/covers
      - name: Commit generated jackets
        run: |
          git add -- song/covers
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update chart jackets'
          git push
